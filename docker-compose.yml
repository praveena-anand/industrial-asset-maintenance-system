services:

  db:
    image: postgres:17
    container_name: maintenance-db
    environment:
      POSTGRES_DB: maintenance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Please set the DB_PASSWORD environment variable}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintenance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: maintenance-app
    container_name: maintenance-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/maintenance_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Please set the DB_PASSWORD environment variable}
      JWT_SECRET: ${JWT_SECRET:?Please set the JWT_SECRET environment variable}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Please set the ADMIN_PASSWORD environment variable}
    ports:
      - "8080:8080"

volumes:
  postgres-data: