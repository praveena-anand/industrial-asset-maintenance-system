spring.application.name=maintenance

spring.datasource.url=jdbc:postgresql://localhost:5432/maintenance_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.com.industrial.maintenance=DEBUG
logging.file.name=logs/maintenance-app.log

# Initial admin account (password comes from the ADMIN_PASSWORD environment variable)
app.admin.email=admin@maintenance.local
app.admin.password=${ADMIN_PASSWORD:}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60