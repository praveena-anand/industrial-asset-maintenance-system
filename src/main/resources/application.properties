spring.application.name=maintenance

spring.datasource.url=jdbc:postgresql://localhost:5432/maintenance_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.com.industrial.maintenance=DEBUG
logging.file.name=logs/maintenance-app.log

# Initial admin account (password comes from the ADMIN_PASSWORD environment variable)
app.admin.email=admin@maintenance.local
app.admin.password=${ADMIN_PASSWORD:}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Sensor alert thresholds
app.thresholds.temperature-warning=100.0
app.thresholds.temperature-critical=110.0
app.thresholds.vibration-warning=7.1
app.thresholds.vibration-critical=11.2
app.thresholds.oil-pressure-warning=3.0
app.thresholds.oil-pressure-critical=2.0

# Anomaly detection (ML service)
app.ml.enabled=true
app.ml.base-url=http://localhost:8000
app.ml.timeout-millis=2000